name: Profile Card + 3D Contributions

on:
  schedule:
    - cron: "30 0 * * *"   # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # neofetch-style card -> dark_mode.svg + light_mode.svg
      - name: Generate profile card
        env:
          # PROFILE_TOKEN (optional PAT) also counts private commits; falls back to the built-in token
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/profile-card.mjs

      # 3D contribution calendar -> profile-3d-contrib/*.svg
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "🔄 Update profile card & 3D contributions"; then
            git push
          fi
